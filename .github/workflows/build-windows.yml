name: Build Windows CUDA Executable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.2.0'
          method: 'network'
          use-github-cache: 'false'

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=ON -DCMAKE_CUDA_COMPILER="$env:CUDA_PATH/bin/nvcc.exe"

      - name: Build Executables
        run: |
          cmake --build build --config Release

      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: omnivoice-windows-cuda-x64
          path: |
            build/bin/*.exe
            build/bin/*.dll
            build/*.exe
            build/*.dll
